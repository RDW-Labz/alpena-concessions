<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leopard Concessions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1EEF2; --surface:#FFFFFF; --ink:#1E1416; --muted:#6B5E61; --line:#E0D8DD;
  --maroon:#7A1F2B; --maroon-2:#5E1520; --on-maroon:#FFFFFF; --gold:#E2A33A;
  --good:#1D7446; --good-bg:#E3F4EA; --bad:#B3261E; --bad-bg:#FBE6E4;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141013; --surface:#221A1E; --ink:#F4EEF0; --muted:#B5A8AC; --line:#3A2E33;
    --maroon:#9E2D42; --maroon-2:#7A1F2B; --on-maroon:#FFFFFF; --gold:#F0B54D;
    --good:#5ED39A; --good-bg:#16322A; --bad:#FF8A80; --bad-bg:#3A1D1C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141013; --surface:#221A1E; --ink:#F4EEF0; --muted:#B5A8AC; --line:#3A2E33;
  --maroon:#9E2D42; --maroon-2:#7A1F2B; --on-maroon:#FFFFFF; --gold:#F0B54D;
  --good:#5ED39A; --good-bg:#16322A; --bad:#FF8A80; --bad-bg:#3A1D1C;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:500;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Header with leopard spots */
header{
  background-color:var(--maroon);
  background-image:
    radial-gradient(ellipse 14px 10px at 20% 30%, rgba(0,0,0,.22) 60%, transparent 62%),
    radial-gradient(ellipse 10px 13px at 62% 70%, rgba(0,0,0,.2) 60%, transparent 62%),
    radial-gradient(ellipse 12px 9px at 85% 20%, rgba(226,163,58,.28) 60%, transparent 62%),
    radial-gradient(ellipse 8px 11px at 40% 85%, rgba(226,163,58,.22) 60%, transparent 62%);
  background-size:90px 70px;
  color:var(--on-maroon);
  padding:18px 18px 16px;
}
header h1{font-family:"Graduate","Rockwell","Georgia",serif;font-weight:400;font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.05;margin:0;letter-spacing:.01em}
header p{margin:4px 0 0;opacity:.85;font-size:.95rem}

.layout{max-width:1200px;margin:0 auto}
main{padding:12px 14px 120px}
section{margin-top:18px}
section h2{font-size:1.05rem;font-weight:800;margin:0 0 10px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

.item{position:relative}
.add{
  width:100%;min-height:84px;text-align:left;border:2px solid var(--line);background:var(--surface);
  border-radius:14px;padding:12px 12px 10px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;
  transition:transform .08s ease, border-color .15s ease;
}
.add:active{transform:scale(.97)}
.add .name{font-weight:700;font-size:1rem;line-height:1.2;padding-right:28px}
.add .price{font-weight:800;font-size:1.15rem;color:var(--maroon)}
.item.on .add{border-color:var(--maroon)}
.badge{
  position:absolute;top:-8px;right:-6px;min-width:30px;height:30px;padding:0 8px;border-radius:15px;
  background:var(--gold);color:#2A1A08;font-weight:800;display:none;align-items:center;justify-content:center;font-size:1rem;
  pointer-events:none;border:2px solid var(--surface)
}
.item.on .badge{display:flex}
.minus{
  position:absolute;bottom:8px;right:8px;width:34px;height:34px;border-radius:10px;border:none;
  background:var(--maroon);color:var(--on-maroon);font-size:1.3rem;font-weight:800;line-height:1;display:none
}
.item.on .minus{display:block}

.feature .add{
  min-height:110px;background:var(--maroon);border-color:var(--maroon);color:var(--on-maroon);
  background-image:linear-gradient(120deg, transparent 55%, rgba(255,255,255,.08) 55%, rgba(255,255,255,.08) 70%, transparent 70%);
}
.feature .add .name{font-size:1.25rem}
.feature .add .price{color:var(--gold);font-size:1.6rem}
.feature .add .sub{font-size:.9rem;opacity:.85}
.feature .minus{background:var(--gold);color:#2A1A08}
.feature.on .add{border-color:var(--gold)}

/* Bottom bar (phone) */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:var(--surface);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:12px;box-shadow:0 -6px 20px rgba(0,0,0,.08)
}
.bar .tot{flex:1}
.bar .tot small{display:block;color:var(--muted);font-size:.85rem}
.bar .tot strong{font-size:1.6rem;font-weight:800}
.btn{border:none;border-radius:12px;padding:14px 18px;font-weight:800;font-size:1.05rem}
.btn.primary{background:var(--maroon);color:var(--on-maroon)}
.btn.primary:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;border:2px solid var(--line)}

/* Checkout sheet */
.sheet{
  position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 24px);
  transform:translateY(100%);visibility:hidden;transition:transform .25s ease, visibility 0s linear .25s
}
body.open .sheet{transform:none;visibility:visible;transition:transform .25s ease}
body.open{overflow:hidden}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sheet-head h2{margin:0;font-family:"Graduate","Rockwell","Georgia",serif;font-weight:400;font-size:1.5rem}
.back{padding:10px 14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.lines{list-style:none;margin:0;padding:0}
.lines li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.lines li:last-child{border-bottom:none}
.lines .ln{font-weight:700;line-height:1.2}
.lines .ln small{display:block;color:var(--muted);font-weight:500}
.step{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:transparent;font-weight:800;font-size:1.15rem;line-height:1}
.step span{min-width:22px;text-align:center;font-weight:800}
.lines .lt{font-weight:800;min-width:64px;text-align:right}
.empty{color:var(--muted);margin:6px 0;line-height:1.4}
.total-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:10px;border-top:2px solid var(--ink)}
.total-row span{font-weight:700;font-size:1.1rem}
.total-row strong{font-size:2rem;font-weight:800}

label.cash{display:block;font-weight:800;margin-bottom:8px}
.cash-in{display:flex;align-items:center;border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:0 12px}
.cash-in:focus-within{border-color:var(--maroon)}
.cash-in span{font-size:1.6rem;font-weight:800;color:var(--muted)}
.cash-in input{flex:1;border:none;background:transparent;font-size:1.8rem;font-weight:800;padding:10px 6px;min-width:0;outline:none}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.quick button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 4px;font-weight:800;font-size:1.05rem}
.quick button.wide{grid-column:span 2}
.quick button:active{background:var(--line)}

.change{border-radius:14px;padding:16px;margin-bottom:12px;text-align:center}
.change.good{background:var(--good-bg);color:var(--good)}
.change.bad{background:var(--bad-bg);color:var(--bad)}
.change.wait{background:var(--surface);border:1px dashed var(--line);color:var(--muted)}
.change .lbl{font-weight:800;font-size:1.1rem}
.change .amt{font-size:3rem;font-weight:800;line-height:1.1;margin-top:2px}
.change .how{margin-top:8px;color:var(--ink);font-weight:600;line-height:1.5}

.new{width:100%;padding:16px;font-size:1.15rem}

.credit{text-align:center;color:var(--muted);font-size:.9rem;font-weight:600;padding:0 14px 110px;margin-top:-90px}
@media (min-width:900px){
  .credit{padding:0 0 24px;margin-top:-20px}
  .layout{display:grid;grid-template-columns:1fr 400px;gap:20px;padding:0 20px}
  main{padding:12px 0 40px}
  .bar{display:none}
  .sheet{
    position:sticky;top:env(safe-area-inset-top,0px);inset:auto;transform:none;visibility:visible;
    height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding:24px 0 24px;transition:none;background:transparent
  }
  .back{display:none}
  body.open{overflow:auto}
}
@media (prefers-reduced-motion: reduce){
  .sheet,body.open .sheet,.add{transition:none}
}
</style>
</head>
<body>
<div class="layout">
  <div>
    <header>
      <h1>Leopard Concessions</h1>
      <p>Tap an item to add it. Tap − to take one off.</p>
    </header>
    <main id="menu"></main>
    <footer class="credit">Hosted by RDW Labz</footer>
  </div>

  <aside class="sheet" id="sheet" aria-label="Order and checkout">
    <div class="sheet-head">
      <h2>Order</h2>
      <button class="btn ghost back" id="back">Back to menu</button>
    </div>

    <div class="card">
      <ul class="lines" id="lines"></ul>
      <div class="total-row"><span>Total</span><strong id="total">$0.00</strong></div>
    </div>

    <div class="card">
      <label class="cash" for="cash">Money received</label>
      <div class="cash-in"><span>$</span><input id="cash" inputmode="decimal" placeholder="0.00" autocomplete="off"></div>
      <div class="quick">
        <button data-add="100">+$1</button>
        <button data-add="500">+$5</button>
        <button data-add="1000">+$10</button>
        <button data-add="2000">+$20</button>
        <button data-add="5000">+$50</button>
        <button data-add="10000">+$100</button>
        <button id="exact" class="wide">Exact amount</button>
        <button id="clearcash" class="wide">Clear money</button>
      </div>
    </div>

    <div class="change wait" id="change" aria-live="polite"></div>

    <button class="btn primary new" id="new">New order</button>
  </aside>
</div>

<div class="bar" id="bar">
  <div class="tot"><small id="count">No items yet</small><strong id="barTotal">$0.00</strong></div>
  <button class="btn primary" id="checkout" disabled>Checkout</button>
</div>

<script>
const MENU = [
  { sec:"Johnny Freeze", feature:true, items:[
    { id:"jf", name:"Johnny Freeze Cream Ice", sub:"Any flavor", price:600 } ]},
  { sec:"Food", items:[
    { id:"cheeseburger", name:"Cheeseburger", price:600 },
    { id:"hamburger", name:"Hamburger", price:600 },
    { id:"lgfrito", name:"Large Frito Pie", price:400 },
    { id:"ccnachos", name:"Chili Cheese Nachos", price:400 },
    { id:"ccdog", name:"Chili Cheese Dog", price:350 },
    { id:"smfrito", name:"Small Frito Pie", price:300 },
    { id:"hotdog", name:"Hot Dog", price:250 },
    { id:"nachos", name:"Nachos", price:250 },
    { id:"pretzel", name:"Pretzel Bites", price:250 } ]},
  { sec:"Snacks & candy", items:[
    { id:"cotton", name:"Cotton Candy", price:250 },
    { id:"candy", name:"Candy", price:200 },
    { id:"popcorn", name:"Popcorn", price:200 },
    { id:"chips", name:"Chips", price:100 },
    { id:"pickles", name:"Pickles", price:100 },
    { id:"pops", name:"Gatorade/Pickle Pops", price:50 },
    { id:"blowpop", name:"Blow Pops", price:50 },
    { id:"smartie", name:"Smartie Suckers", price:25 } ]},
  { sec:"Drinks", items:[
    { id:"pop", name:"Pop", price:300 },
    { id:"gatorade", name:"Gatorade", price:300 },
    { id:"water", name:"Water", price:100 } ]}
];
const ITEMS = {}; MENU.forEach(s => s.items.forEach(i => ITEMS[i.id] = i));
const ORDER = []; // ids in the order they were first added
let qty = {};
let cash = 0; // cents

const $ = id => document.getElementById(id);
const money = c => "$" + (c/100).toFixed(2);

function buildMenu(){
  const m = $("menu");
  MENU.forEach(s => {
    const sec = document.createElement("section");
    sec.innerHTML = `<h2>${s.sec}</h2><div class="grid"></div>`;
    const g = sec.querySelector(".grid");
    s.items.forEach(it => {
      const d = document.createElement("div");
      d.className = "item" + (s.feature ? " feature" : "");
      d.dataset.id = it.id;
      d.innerHTML = `
        <button class="add" aria-label="Add ${it.name}, ${money(it.price)}">
          <span class="name">${it.name}${it.sub ? `<span class="sub" style="display:block;font-weight:600">${it.sub}</span>` : ""}</span>
          <span class="price">${money(it.price)}</span>
        </button>
        <span class="badge" aria-hidden="true"></span>
        <button class="minus" aria-label="Remove one ${it.name}">−</button>`;
      d.querySelector(".add").onclick = () => change(it.id, 1);
      d.querySelector(".minus").onclick = () => change(it.id, -1);
      g.appendChild(d);
    });
    m.appendChild(sec);
  });
}

function change(id, n){
  const q = (qty[id] || 0) + n;
  if (q <= 0){ delete qty[id]; const i = ORDER.indexOf(id); if (i > -1) ORDER.splice(i,1); }
  else { if (!qty[id]) ORDER.push(id); qty[id] = q; }
  render();
}

function total(){ return ORDER.reduce((t,id) => t + ITEMS[id].price * qty[id], 0); }
function count(){ return ORDER.reduce((t,id) => t + qty[id], 0); }

function breakdown(c){
  const D = [[2000,"$20 bill","$20 bills"],[1000,"$10 bill","$10 bills"],[500,"$5 bill","$5 bills"],[100,"$1 bill","$1 bills"],
             [25,"quarter","quarters"],[10,"dime","dimes"],[5,"nickel","nickels"],[1,"penny","pennies"]];
  const out = [];
  D.forEach(([v,one,many]) => { const n = Math.floor(c/v); if (n){ out.push(`${n} ${n===1?one:many}`); c -= n*v; } });
  return out.join(", ");
}

function render(){
  const t = total(), n = count();
  document.querySelectorAll(".item").forEach(el => {
    const q = qty[el.dataset.id] || 0;
    el.classList.toggle("on", q > 0);
    el.querySelector(".badge").textContent = q;
  });
  $("barTotal").textContent = money(t);
  $("count").textContent = n ? `${n} item${n===1?"":"s"}` : "No items yet";
  $("checkout").disabled = n === 0;
  $("total").textContent = money(t);

  const L = $("lines");
  if (!n){ L.innerHTML = `<li style="display:block;border:none"><p class="empty">Tap items on the menu to start an order.</p></li>`; }
  else {
    L.innerHTML = "";
    ORDER.forEach(id => {
      const it = ITEMS[id];
      const li = document.createElement("li");
      li.innerHTML = `<div class="ln">${it.name}<small>${money(it.price)} each</small></div>
        <div class="step"><button aria-label="Remove one ${it.name}">−</button><span>${qty[id]}</span><button aria-label="Add one ${it.name}">+</button></div>
        <div class="lt">${money(it.price*qty[id])}</div>`;
      const b = li.querySelectorAll(".step button");
      b[0].onclick = () => change(id,-1);
      b[1].onclick = () => change(id,1);
      L.appendChild(li);
    });
  }

  const C = $("change");
  if (!n || cash === 0){
    C.className = "change wait";
    C.innerHTML = `<div class="lbl">${n ? "Enter the money received" : "Change due"}</div><div class="amt">${n ? "—" : "$0.00"}</div>`;
  } else if (cash < t){
    C.className = "change bad";
    C.innerHTML = `<div class="lbl">Not enough. Still need</div><div class="amt">${money(t - cash)}</div>`;
  } else {
    const d = cash - t;
    C.className = "change good";
    C.innerHTML = `<div class="lbl">Change due</div><div class="amt">${money(d)}</div>` +
      (d ? `<div class="how">Give back: ${breakdown(d)}</div>` : `<div class="how">Exact. No change.</div>`);
  }
}

function setCash(c){ cash = Math.max(0, c); $("cash").value = cash ? (cash/100).toFixed(2) : ""; render(); }

$("cash").addEventListener("input", e => {
  const v = parseFloat(e.target.value.replace(/[^0-9.]/g,""));
  cash = isNaN(v) ? 0 : Math.round(v*100);
  render();
});
document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => setCash(cash + Number(b.dataset.add)));
$("exact").onclick = () => setCash(total());
$("clearcash").onclick = () => setCash(0);
$("checkout").onclick = () => document.body.classList.add("open");
$("back").onclick = () => document.body.classList.remove("open");
$("new").onclick = () => {
  qty = {}; ORDER.length = 0; setCash(0);
  document.body.classList.remove("open");
  window.scrollTo({top:0});
};

buildMenu();
render();
</script>
</body>
</html>
